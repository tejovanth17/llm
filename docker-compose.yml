services:
  aether-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: aether-ai-chatbot:latest
    container_name: aether_ai_chatbot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent storage for chat history & settings
      - aether_data:/app/server/data

volumes:
  aether_data:
    name: aether_chat_storage
