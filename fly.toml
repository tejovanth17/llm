# Fly.io Global Edge Deployment Configuration
app = "aether-ai-chatbot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "aether_data"
  destination = "/app/server/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
